<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Phinex Admin</title>
<link rel="icon" href="assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="32" height="32"> Phinex admin</a>
  <button class="theme-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark theme">
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="btn btn-small btn-ghost" id="logout" hidden>Log out</button>
</header>

<main class="admin">

  <!-- Login -->
  <section id="login-view" class="login">
    <h1>Log in</h1>
    <form id="login-form">
      <label>Email <input type="email" id="email" required autocomplete="username"></label>
      <label>Password <input type="password" id="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Log in</button>
      <p class="msg" id="login-msg" role="status"></p>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="dash-view" hidden>
    <div class="toolbar">
      <h1>Customer requests <span id="count"></span></h1>
      <div class="tools">
        <select id="filter" aria-label="Filter by status">
          <option value="all">All</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="closed">Closed</option>
        </select>
        <button class="btn btn-small btn-ghost" id="refresh">Refresh</button>
      </div>
    </div>
    <p class="msg" id="dash-msg" role="status"></p>
    <div id="list" class="list"></div>
  </section>

</main>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
